name: Deploy Monorepo to Render & Vercel (Monorepo)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install frontend dependencies
        working-directory: ./frontend/vcare
        run: |
          npm ci

      - name: Build frontend
        working-directory: ./frontend/vcare
        run: |
          npm run build

      - name: Lint frontend (optional)
        working-directory: ./frontend/vcare
        run: |
          npm run lint || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install -r requirements.txt

      - name: Lint backend (optional)
        working-directory: ./backend
        run: |
          python -m pip install pyflakes || true
          python -m pyflakes **/*.py || true

      - name: "Status: Build checks completed"
        run: |
          echo "Frontend and backend build checks completed. Deployments (Render/Vercel) will be triggered via GitHub integrations if configured."
